name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ladon/core build
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm --filter web build

  eval:
    # Re-runs the confusion matrix against real registries + the local canary registry.
    runs-on: ubuntu-latest
    needs: test
    env:
      # Node on Ubuntu resolves localhost to ::1 first; Verdaccio listens on 127.0.0.1
      LADON_DEMO_REGISTRY: http://127.0.0.1:4873/
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ladon/core build
      - name: start local Verdaccio
        run: |
          nohup pnpm demo:registry > verdaccio.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:4873/-/ping && exit 0; sleep 1; done
          cat verdaccio.log; exit 1
      - run: pnpm demo:publish-canaries
      - run: node scripts/eval.mjs | tee eval.txt
      - name: fail if targets missed
        run: grep -E "bad caught (9[0-9]|100)\.[0-9] %, benign held ([0-4]\.[0-9]|5\.0) %" eval.txt
      - uses: actions/upload-artifact@v4
        with: { name: eval, path: "docs/EVAL.md" }
